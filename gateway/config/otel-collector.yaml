# OpenTelemetry Collector of the local stack (backlog E5.3). It receives the guard's spans (GenAI semantic
# conventions, no content) and prints them; in production, replace the debug exporter by the SIEM's
# (OTLP, Splunk HEC, Elastic, Sentinel...). The redaction processor is a second safeguard: it drops any
# attribute that could carry content if an instrumentation ever sent one.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  attributes/no-content:
    actions:
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: gen_ai.system_instructions, action: delete}
      - {key: gen_ai.tool.definitions, action: delete}
  batch: {}

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/no-content, batch]
      exporters: [debug]
