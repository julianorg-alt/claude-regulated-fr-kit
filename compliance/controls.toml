# Contrôles du kit, reliés à au moins un texte (texts.toml) et à au moins un test automatisé (backlog E9.1).
# Formats de test : pytest:<fichier>::<fonction>, unittest:<fichier>::<Classe>.<méthode>,
# tftest:<fichier>::<run>, rego:<fichier>::<règle>, make:<cible>. `make traceability` vérifie que chaque
# référence existe, qu'aucun contrôle n'est orphelin et que docs/compliance/matrix.md est à jour.

[[control]]
id = "C01"
