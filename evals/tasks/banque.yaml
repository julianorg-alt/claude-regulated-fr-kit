      value: ["15 septembre", "29"]
    - type: llm-rubric
      metric: exactitude
      value: "[grille banque-17/exactitude] La date du 15 septembre 2026 est correcte et le calcul de 29 jours entre le 2 septembre et le 1er octobre est exact. Si tu ne peux pas trancher, réponds pass=false, score=0 et commence la raison par INCONNU."
- description: "banque-18 · rédaction · accusé de réception de réclamation"
  vars:
