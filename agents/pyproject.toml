[project]
name = "crfr-agents"
version = "0.8.0"
description = "Agent and MCP governance of claude-regulated-fr: approval of irreversible actions, MCP registry and proxy, red team harness"
requires-python = ">=3.12"
dependencies = ["pyjwt==2.15.1", "cryptography==50.0.2"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
