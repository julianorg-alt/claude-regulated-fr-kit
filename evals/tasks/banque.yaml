    - type: javascript
      value: "/(madame|monsieur)/i.test(output)"
    - type: javascript
      value: "/15 jours ouvrés/i.test(output)"
- description: "banque-19 · extraction · clôture d'un livret"
  vars:
    id: banque-19
    sector: banque
    sector_label: bancaire
    critical: false
    task: |
      Extrais le produit, l'action demandée et le montant (nombre). Réponds uniquement par un objet JSON, sans texte autour. Clés : produit, action, montant.

      ---DOCUMENT---
      Bonjour, je souhaite clôturer mon livret d'épargne et virer le solde de 2 300 euros vers mon compte courant. Merci.
      ---FIN---
  options:
    transform: file://transforms/strip-json-fence.js:stripJsonFence
  assert:
    - type: is-json
    - type: javascript
      value: "(()=>{const j=JSON.parse(output);return j.montant===2300&&/cl[ôo]ture/i.test(j.action)&&/livret/i.test(j.produit)})()"
- description: "banque-20 · vérification · brouillon de courriel contraire à la règle"
  vars:
    id: banque-20
    sector: banque
    sector_label: bancaire
    critical: false
    task: |
      Vérifie ce brouillon de courriel au regard de la règle interne et indique s'il est conforme.

      ---DOCUMENT---
      Règle interne SEC-4 (fictive) : un courriel ne demande jamais au client son code secret, son mot de passe ou le code de sa carte.

      Brouillon : « Madame, Monsieur, pour finaliser votre dossier, merci de répondre à ce courriel en indiquant votre code secret de carte. Cordialement. »
      ---FIN---
  assert:
    - type: javascript
      value: "/(non[- ]conforme|pas conforme|ne respecte pas|enfreint|contraire à la règle)/i.test(output)"
    - type: icontains
      value: "code secret"
