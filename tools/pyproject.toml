[project]
name = "crfr-tools"
version = "0.1.0"
description = "Residency inventory and checks for the claude-regulated-fr kit"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# End-to-end tests call the local stack (URLs from the environment) and docker compose.
"../gateway/tests/*" = ["S310", "S603", "S607"]
